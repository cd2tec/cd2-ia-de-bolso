# Publica o Worker de teste a cada push na branch homolog.
# O destino é fixo: --env sandbox, o Worker cd2-instalacao-sandbox,
# no endereço instalariadebolso-teste.cd2.com.br.
# Produção (cd2-instalacao / instalariadebolso.cd2.com.br) não entra aqui.
name: Deploy teste
on:
  push:
    branches: [homolog]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-teste
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/homolog'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Conferir o token da Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Falta o secret CLOUDFLARE_API_TOKEN neste repositório."
            echo "No Cloudflare, crie um token com a permissão Edit Cloudflare Workers, só nesta conta."
            echo "No GitHub, grave o valor no secret CLOUDFLARE_API_TOKEN. Não commite o token."
            exit 1
          fi
      - name: Publicar o Worker de teste
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "6cb9883b03e0e94fb939ffb53d382955"
          workingDirectory: worker
          wranglerVersion: "4"
          packageManager: npm
          environment: sandbox
          command: deploy --env sandbox
