# Testes do cd2-ctl (Go), do instalador (Go) e do front (node --test) em todo pull request e push na main.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache: false
      - name: gofmt, go vet e go test (installer/)
        working-directory: installer
        run: |
          test -z "$(gofmt -l .)"
          go vet ./internal/... ./cmd/...
          GOOS=windows go vet ./internal/... ./cmd/...
          GOOS=darwin go vet ./internal/... ./cmd/...
          go test ./internal/... ./cmd/...
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ctl/go.mod
          cache: false
      - name: go vet e go test (ctl/)
        working-directory: ctl
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          GOOS=windows go vet ./...
          go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --test
        run: node --test
