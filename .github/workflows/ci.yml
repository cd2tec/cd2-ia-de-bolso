# Testes do cd2-ctl (Go), do instalador (Go), do lançador (Go) e do front (node --test) em todo pull request e push na main.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache: false
      - name: gofmt, go vet e go test (installer/)
        working-directory: installer
        run: |
          test -z "$(gofmt -l .)"
          go vet ./internal/... ./cmd/...
          GOOS=windows go vet ./internal/... ./cmd/...
          GOOS=darwin go vet ./internal/... ./cmd/...
          go test ./internal/... ./cmd/...
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
          cache: false
      - name: gofmt, go vet e go test (launcher/)
        working-directory: launcher
        run: |
          test -z "$(gofmt -l .)"
          go vet ./internal/...
          GOOS=windows go vet ./internal/...
          GOOS=darwin go vet ./internal/...
          # O pacote main (janela e bandeja) no Windows passa sem cgo; no Mac a
          # bandeja usa cgo e no Linux o Wails pede o GTK, então ficam de fora.
          GOOS=windows go vet .
          go test ./internal/...
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ctl/go.mod
          cache: false
      - name: go vet e go test (ctl/)
        working-directory: ctl
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          GOOS=windows go vet ./...
          go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --test
        run: node --test
