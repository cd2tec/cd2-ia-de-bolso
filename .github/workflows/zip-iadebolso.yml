# ZIP da IA de Bolso para download fácil: a cada push no main, compila o lançador (IA de Bolso.exe
# no Windows e IA de Bolso.app no Mac), monta cd2tech-iadebolso.zip (pasta cd2tech-iadebolso, fins
# de linha do .gitattributes, sem testes nem specs, com os dois lançadores dentro) e troca o arquivo da
# release fixa "iadebolso" e publica o manifesto.json (versões, URLs e SHA-256) que o instalador
# desktop lê. O link de download nunca muda. A release não vira "latest", para não
# disputar com as releases do cd2-ctl.
name: zip iadebolso
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zip-iadebolso
  cancel-in-progress: true
jobs:
  # Guarda de release: o ZIP do pen drive nunca sai com a chave pública PROVISÓRIA do vetor de teste
  # (a privada dela está no repositório). Falha até a chave de produção entrar em instalacao/chave/publica.go.
  guarda-chave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: instalacao/go.mod
      - name: Conferir que a chave pública não é a de teste
        run: cd instalacao && go test -tags release ./chave/
  # Lançador do pen drive (Wails, em launcher/). Entra no ZIP antes do manifesto, que calcula o SHA do ZIP.
  # Go fixado em 1.23.x pelo mesmo motivo dos instaladores (o CLI do Wails 2.10.1 não compila com o Go mais novo).
  lancador-mac:
    needs: guarda-chave
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Instalar o Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
      - name: Compilar o app universal
        working-directory: launcher
        run: |
          VERSAO="$(tr -d ' \r\n' < ../VERSION)"
          wails build -clean -trimpath -platform darwin/universal -ldflags "-X main.versao=$VERSAO"
      - name: Assinar e notarizar (Developer ID, ou ad hoc sem os secrets)
        working-directory: launcher/build/bin
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/assinar-mac.sh" app "IA de Bolso.app"
      - name: Empacotar com o ditto
        working-directory: launcher/build/bin
        run: |
          # O ditto guarda permissões e links do .app, que um zip comum perderia. Sem atributos estendidos
          # nem resource fork: senão entram ._ no ZIP, que viram lixo no pen drive (e a quarentena iria
          # junto). O ticket da notarização não se perde: o stapler o grava em Contents/CodeResources.
          ditto -c -k --norsrc --noextattr --keepParent "IA de Bolso.app" lancador-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lancador-mac
          path: launcher/build/bin/lancador-mac.zip
          if-no-files-found: error

  lancador-windows:
    needs: guarda-chave
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Instalar o Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
      - name: Compilar o exe
        working-directory: launcher
        run: |
          VERSAO="$(tr -d ' \r\n' < ../VERSION)"
          # WebView2 pela estratégia padrão do Wails (o bootstrapper baixa se faltar), sem -webview2 embed.
          wails build -clean -trimpath -platform windows/amd64 -ldflags "-X main.versao=$VERSAO"
      - uses: actions/upload-artifact@v4
        with:
          name: lancador-windows
          path: launcher/build/bin/IA de Bolso.exe
          if-no-files-found: error

  zip:
    needs: [guarda-chave, lancador-mac, lancador-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar o ZIP
        run: |
          git archive --format=zip --prefix=cd2tech-iadebolso/ -o cd2tech-iadebolso.zip HEAD -- . ':!tests' ':!docs/superpowers' ':!.github' ':!installer' ':!launcher'
          unzip -l cd2tech-iadebolso.zip | tail -1
      # Os dois lançadores entram aqui, antes do manifesto. O ditto guardou o .app com permissões e links;
      # o unzip e o zip -y os preservam (-y guarda os links como links, não como cópias).
      - uses: actions/download-artifact@v4
        with:
          name: lancador-mac
          path: lancador-mac
      - uses: actions/download-artifact@v4
        with:
          name: lancador-windows
          path: lancador-windows
      - name: Pôr os lançadores no ZIP
        run: |
          unzip -q lancador-mac/lancador-mac.zip -d cd2tech-iadebolso/
          cp "lancador-windows/IA de Bolso.exe" cd2tech-iadebolso/
          zip -qry cd2tech-iadebolso.zip "cd2tech-iadebolso/IA de Bolso.app" "cd2tech-iadebolso/IA de Bolso.exe"
          LISTA="$(unzip -l cd2tech-iadebolso.zip)"
          printf '%s\n' "$LISTA" | grep -F "cd2tech-iadebolso/IA de Bolso.exe" >/dev/null || { echo "Faltou o IA de Bolso.exe no ZIP."; exit 1; }
          printf '%s\n' "$LISTA" | grep -F "cd2tech-iadebolso/IA de Bolso.app/Contents/MacOS/IA de Bolso" >/dev/null || { echo "Faltou o executável do IA de Bolso.app no ZIP."; exit 1; }
          printf '%s\n' "$LISTA" | tail -1
      # Tudo o que pode falhar (API, HEAD, go run) roda antes de qualquer upload: falha aborta sem tocar na release.
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache: false
      - name: Montar o manifesto.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # URL e SHA-256 do motor fixos no core/prepare-unix.sh (o cmd/manifesto confere que o
          # prepare-windows.ps1 diz o mesmo). Nada de "ultima release": o instalador e os scripts gravam o mesmo motor.
          LLAMAFILE_URL="$(sed -n 's/^LLAMAFILE_URL="${CD2_LLAMAFILE_URL:-\(.*\)}"$/\1/p' core/prepare-unix.sh)"
          [ -n "$LLAMAFILE_URL" ] || { echo "Não achei LLAMAFILE_URL no core/prepare-unix.sh."; exit 1; }
          MODELO_URL="$(sed -n 's/^MODEL_URL="${CD2_MODEL_URL:-\(.*\)}"$/\1/p' core/prepare-unix.sh)"
          # O motor é baixado aqui para medir o SHA-256 e o tamanho: o cmd/manifesto recusa se o SHA
          # medido não bater com o fixo nos scripts (URL trocada de conteúdo ou SHA errado no script).
          MOTOR="$RUNNER_TEMP/llamafile"
          curl -fsSL -H 'User-Agent: cd2-harness' -o "$MOTOR" "$LLAMAFILE_URL"
          LLAMAFILE_SHA256="$(sha256sum "$MOTOR" | cut -d ' ' -f 1)"
          LLAMAFILE_BYTES="$(stat -c %s "$MOTOR")"
          rm -f "$MOTOR"
          if [ "$LLAMAFILE_BYTES" -le 0 ]; then echo "O llamafile baixado veio vazio."; exit 1; fi
          # Tamanho pelo HEAD; -f faz um 404 falhar em vez de devolver o tamanho da página de erro.
          tamanho() {
            local h v
            # O curl roda sozinho: num pipe, sem pipefail, a falha dele sumiria atrás do awk.
            h="$(curl -fsIL -H 'User-Agent: cd2-harness' "$1")" || return 1
            v="$(printf '%s\n' "$h" | tr -d '\r' | awk 'tolower($1) == "content-length:" { v = $2 } END { print v }')"
            case "$v" in ''|*[!0-9]*) return 1 ;; esac
            [ "$v" -gt 0 ] || return 1
            echo "$v"
          }
          MODELO_BYTES="$(tamanho "$MODELO_URL")" || { echo "Não consegui ler o tamanho do modelo."; exit 1; }
          (cd installer && go run ./cmd/manifesto \
            -prepare-unix ../core/prepare-unix.sh \
            -prepare-windows ../core/prepare-windows.ps1 \
            -version-file ../VERSION \
            -zip ../cd2tech-iadebolso.zip \
            -zip-url "https://github.com/${{ github.repository }}/releases/download/iadebolso/cd2tech-iadebolso.zip" \
            -llamafile-sha256 "$LLAMAFILE_SHA256" \
            -llamafile-bytes "$LLAMAFILE_BYTES" \
            -modelo-bytes "$MODELO_BYTES") > manifesto.json
          cat manifesto.json
      # Só o main publica na release pública. Em outro branch (workflow_dispatch) os arquivos sobem como artefato.
      - name: Publicar na release iadebolso
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO="$(tr -d ' \r\n' < VERSION)"
          if ! gh release view iadebolso -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create iadebolso --latest=false --title "IA de Bolso" \
              --notes "Baixe o instalador (CD2-IA-de-Bolso-Windows.exe ou CD2-IA-de-Bolso-Mac.dmg), abra, espete um pen drive de 16 GB e siga as quatro telas. Prefere o jeito técnico? Baixe cd2tech-iadebolso.zip, extraia e dê dois cliques em GRAVAR-PENDRIVE-Windows.bat. Para usar o pen drive pronto, dê dois cliques em IA de Bolso no pen drive. Passo a passo: https://cd2tec.github.io/cd2-ia-de-bolso/#pendrive" \
              -R "$GITHUB_REPOSITORY"
          fi
          gh release upload iadebolso cd2tech-iadebolso.zip --clobber -R "$GITHUB_REPOSITORY"
          gh release edit iadebolso --title "IA de Bolso $VERSAO" --latest=false -R "$GITHUB_REPOSITORY"
          # O manifesto sobe depois do ZIP, em sequência: ele nunca aponta para o SHA de um ZIP que ainda não está lá.
          gh release upload iadebolso manifesto.json --clobber -R "$GITHUB_REPOSITORY"
      - name: Guardar o ZIP e o manifesto como artefato (fora do main)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: zip-e-manifesto
          path: |
            cd2tech-iadebolso.zip
            manifesto.json

  # Instaladores desktop (Wails). Rodam depois do job zip, que garante a release iadebolso.
  # O CLI do Wails 2.10.1 não compila com o Go mais novo ("package context without types"),
  # por isso o Go fica fixado em 1.23.x nestes dois jobs.
  instalador-mac:
    needs: zip
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Instalar o Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
      - name: Compilar o app universal
        working-directory: installer
        run: |
          VERSAO="$(tr -d ' \r\n' < ../VERSION)"
          wails build -clean -trimpath -platform darwin/universal -ldflags "-X main.versao=$VERSAO"
      - name: Assinar e notarizar o app e o dmg (Developer ID, ou ad hoc sem os secrets)
        working-directory: installer/build/bin
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # O app é notarizado antes de entrar no dmg, para levar o próprio ticket: quem o arrasta para
          # Aplicativos e abre sem internet não depende do ticket do dmg.
          bash "$GITHUB_WORKSPACE/.github/scripts/assinar-mac.sh" app "CD2 IA de Bolso.app"
          hdiutil create -volname "CD2 IA de Bolso" -srcfolder "CD2 IA de Bolso.app" -ov -format UDZO CD2-IA-de-Bolso-Mac.dmg
          bash "$GITHUB_WORKSPACE/.github/scripts/assinar-mac.sh" dmg CD2-IA-de-Bolso-Mac.dmg
      - name: Publicar na release iadebolso
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload iadebolso installer/build/bin/CD2-IA-de-Bolso-Mac.dmg --clobber -R "$GITHUB_REPOSITORY"
      - name: Guardar o dmg como artefato (fora do main)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: instalador-mac
          path: installer/build/bin/CD2-IA-de-Bolso-Mac.dmg

  instalador-windows:
    needs: zip
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Instalar o Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
      - name: Compilar o exe (pede administrador pelo manifesto)
        working-directory: installer
        run: |
          VERSAO="$(tr -d ' \r\n' < ../VERSION)"
          wails build -clean -trimpath -platform windows/amd64 -webview2 embed -ldflags "-X main.versao=$VERSAO"
          mv build/bin/CD2-IA-de-Bolso.exe build/bin/CD2-IA-de-Bolso-Windows.exe
      - name: Publicar na release iadebolso
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload iadebolso installer/build/bin/CD2-IA-de-Bolso-Windows.exe --clobber -R "$GITHUB_REPOSITORY"
      - name: Guardar o exe como artefato (fora do main)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: installer/build/bin/CD2-IA-de-Bolso-Windows.exe
