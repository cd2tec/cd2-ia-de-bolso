# Publica o Worker de produção a cada push na branch main.
# O destino é fixo, sem --env: o Worker cd2-instalacao,
# no endereço instalariadebolso.cd2.com.br.
# O teste (cd2-instalacao-sandbox) não entra aqui.
name: Deploy produção
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-producao
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Conferir o token da Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Falta o secret CLOUDFLARE_API_TOKEN neste repositório."
            exit 1
          fi
      - name: Publicar o Worker de produção
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "6cb9883b03e0e94fb939ffb53d382955"
          workingDirectory: worker
          wranglerVersion: "4"
          packageManager: npm
          command: deploy
